<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #cccccc;
        }

        h1 {
            color: #2563eb;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>BMI Calculator</h1>

    <p>Enter your measurements below</p>

    <input
        type="number"
        id="weight"
        placeholder="Weight (kg)"
        min="0.1"
        step="any"
    >

    <input
        type="number"
        id="height"
        placeholder="Height (cm)"
        min="1"
        step="any"
    >

    <br><br>

    <button onclick="calculateBMI()">
        Calculate BMI
    </button>

    <div id="result"></div>

</div>

<script>

function calculateBMI() {

    let weight = Number(
        document.getElementById("weight").value
    );

    let height = Number(
        document.getElementById("height").value
    );

    if (weight <= 0 || height <= 0) {
        document.getElementById("result").innerHTML =
            "Please enter valid measurements.";
        return;
    }

    let heightInMeter = height / 100;

    let bmi = weight / (heightInMeter * heightInMeter);

    let category;

    if (bmi < 18.5) {
        category = "Underweight";
    }
    else if (bmi < 25) {
        category = "Normal weight";
    }
    else if (bmi < 30) {
        category = "Overweight";
    }
    else {
        category = "Obesity";
    }

    document.getElementById("result").innerHTML =
        "Your BMI: " + bmi.toFixed(2) +
        "<br>Category: " + category;
}

</script>

</body>
</html>
